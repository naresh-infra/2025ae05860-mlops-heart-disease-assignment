name: Production MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      MLFLOW_ALLOW_FILE_STORE: "true"
      MLFLOW_TRACKING_URI: file:./mlruns-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip check

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run data preparation script
        run: python -m src.data_loader

      - name: Run exploratory data analysis
        run: PYTHONPATH=. python notebooks/01_exploratory_data_analysis.py

      - name: Train model and track with MLflow
        run: python -m src.train

      - name: Run Pytest test suite
        run: PYTHONPATH=. python -m pytest tests/ -v

      - name: Build Docker Container
        run: docker build -t heart-disease-api:latest .

      - name: Run Docker container smoke test
        shell: bash
        run: |
          set -euo pipefail
          container_name=heart-disease-api-smoke
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:8000:8000 \
            heart-disease-api:latest

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Container did not become healthy."
            exit 1
          fi

          curl --fail --show-error --silent \
            --header "Content-Type: application/json" \
            --data '{"age":58,"sex":1,"cp":2,"trestbps":120,"chol":240,"fbs":0,"restecg":1,"thalach":160,"exang":0,"oldpeak":1.2,"slope":1,"ca":0,"thal":3}' \
            http://127.0.0.1:8000/predict | tee prediction.json
          python -c "import json; response=json.load(open('prediction.json')); assert response['prediction'] in (0, 1); assert 0 <= response['risk_score'] <= 1; assert response['status'] in ('healthy', 'risk_detected')"

      - name: Create ephemeral Kubernetes cluster
        uses: helm/kind-action@v1.12.0

      - name: Deploy and verify on Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          kind load docker-image heart-disease-api:latest --name chart-testing
          kubectl apply -f k8s/
          kubectl rollout status deployment/heart-disease-api-deployment --timeout=180s
          kubectl get deployment,service,ingress,pods -o wide | tee k8s-deployment-evidence.txt
          kubectl port-forward service/heart-disease-api-service 8001:80 >k8s-port-forward.log 2>&1 &
          port_forward_pid=$!
          cleanup() {
            kill "$port_forward_pid" >/dev/null 2>&1 || true
            kubectl logs deployment/heart-disease-api-deployment --all-pods=true || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat k8s-port-forward.log
            echo "Kubernetes service did not become healthy."
            exit 1
          fi

          curl --fail --show-error --silent \
            --header "Content-Type: application/json" \
            --data '{"age":58,"sex":1,"cp":2,"trestbps":120,"chol":240,"fbs":0,"restecg":1,"thalach":160,"exang":0,"oldpeak":1.2,"slope":1,"ca":0,"thal":3}' \
            http://127.0.0.1:8001/predict | tee k8s-prediction.json
          python -c "import json; response=json.load(open('k8s-prediction.json')); assert response['prediction'] in (0, 1); assert 0 <= response['risk_score'] <= 1; assert response['status'] in ('healthy', 'risk_detected')"

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-pipeline-artifacts
          path: |
            mlruns-ci/
            reports/figures/
            models/heart_disease_pipeline.pkl
            k8s-deployment-evidence.txt
            k8s-prediction.json
            k8s-port-forward.log
          if-no-files-found: warn